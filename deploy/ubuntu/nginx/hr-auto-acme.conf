# Temporary site used only while requesting the first certificate.
# Serves the Let's Encrypt challenge and nothing else.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/hr-auto-acme;
    }

    location / {
        return 404;
    }
}
