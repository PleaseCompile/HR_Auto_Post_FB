# HR Auto over plain HTTP on port 80, for testing in a VM or on a LAN before
# a domain and certificate exist. Installed by install.sh (access mode "lan").
# Do not use this on the public internet: passwords would travel unencrypted.

limit_req_zone $binary_remote_addr zone=hrauto_login:10m rate=10r/m;
map $http_upgrade $hrauto_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    include /etc/nginx/snippets/hr-auto-locations.conf;
}
