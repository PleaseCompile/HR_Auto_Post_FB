# HR Auto public site with HTTPS (Let's Encrypt). Installed by install.sh as
# /etc/nginx/sites-available/hr-auto with __DOMAIN__ replaced.

limit_req_zone $binary_remote_addr zone=hrauto_login:10m rate=10r/m;
map $http_upgrade $hrauto_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Certificate renewals (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/hr-auto-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hrauto_ssl:5m;
    ssl_session_timeout 1d;

    server_tokens off;
    # Draft photos are shrunk in the browser, but allow up to 10 originals.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/hr-auto-locations.conf;
}
