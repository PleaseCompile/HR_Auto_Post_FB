# HR Auto routes behind Nginx. Installed by deploy/ubuntu/install.sh with
# __PORT__ replaced; re-running the installer rewrites this file.
#
# Every request needs the team login (enforced by the HR Auto app itself).
# The browser view (noVNC) is a separate service, so Nginx asks the app via
# auth_request before letting anyone reach it.

# Login attempts: at most 10 per minute per address (the app also locks an
# address after 5 wrong passwords).
location = /api/auth/login {
    limit_req zone=hrauto_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:__PORT__;
    include /etc/nginx/snippets/hr-auto-proxy.conf;
}

# Internal sub-request used by auth_request below.
location = /_hr_auto_auth {
    internal;
    proxy_pass http://127.0.0.1:__PORT__/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
}

# Browser screen (noVNC + websocket), only for signed-in team members.
location /vnc/ {
    auth_request /_hr_auto_auth;
    error_page 401 = @hr_auto_login;
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hrauto_connection;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location @hr_auto_login {
    return 302 /login;
}

location / {
    proxy_pass http://127.0.0.1:__PORT__;
    include /etc/nginx/snippets/hr-auto-proxy.conf;
}
