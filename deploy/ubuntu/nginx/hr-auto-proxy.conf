# Headers HR Auto relies on (installed as /etc/nginx/snippets/hr-auto-proxy.conf).
# $http_host keeps the port, so the app's same-origin check matches the
# browser's Origin header even when testing on a non-standard port.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_read_timeout 180s;
proxy_send_timeout 180s;
